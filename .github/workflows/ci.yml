# PR과 main 반영 때마다 빌드·테스트를 돌린다 (#12).
# 비공개 저장소는 Actions 무료 사용 시간에 한도가 있어서, Rust 빌드 결과를 캐시해 시간을 줄인다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# 같은 PR에 새 커밋이 오면 이전 실행은 취소한다 (사용 시간 절약).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # DB 시험(#[sqlx::test])용 PostgreSQL. 시험마다 빈 DB를 새로 만들어 쓴다. 비밀번호는 CI 전용 예시 값이다.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: onair
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: onair
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onair"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://onair:ci-only@localhost:5432/onair
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: 포맷 검사
        run: cargo fmt --check
      - name: 린트 (clippy)
        run: cargo clippy --all-targets -- -D warnings
      - name: 테스트
        run: cargo test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 타입 검사 + 빌드
        run: npm run build

  # 배포용 이미지를 실제로 만들고 띄워 본다(#22).
  # 2026-11-11 배포 장애(#44): 로컬 시험은 통과했는데 배포 이미지에서만 백엔드가 시작하자마자 멈췄다.
  # 그래서 배포와 같은 Dockerfile로 이미지를 만들고, DB에 붙여 시작되는지·응답하는지까지 본다.
  # (서버는 ARM이지만 CI는 시간이 덜 드는 amd64로 만든다. 코드·설정 문제는 같은 방식으로 드러난다.)
  deploy-images:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: onair
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: onair
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onair"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 배포 compose 설정 검사
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config -q
      - name: 백엔드 이미지 만들기
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: onair-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: 화면(Caddy) 이미지 만들기
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          load: true
          tags: onair-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Caddy 설정 검사
        run: docker run --rm -e DOMAIN=example.com onair-web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: 백엔드 이미지 띄워 보기 (DB 연결, 마이그레이션, 응답)
        run: |
          # CI 전용 예시 값이다(진짜 비밀값 아님). 토스 키도 test_로 시작하는 가짜 값이다.
          docker run -d --name be --network host \
            -e DATABASE_URL=postgres://onair:ci-only@localhost:5432/onair \
            -e BIND_ADDR=0.0.0.0:8080 -e RUST_LOG=info \
            -e OME_ADMISSION_SECRET=ci-only-secret-0123456789 \
            -e OME_API_URL=http://localhost:9 -e OME_API_TOKEN=ci-only-token-0123456789 \
            -e DEMO_LOGIN=true -e RECORDINGS_DIR=/tmp \
            -e TOSS_CLIENT_KEY=test_gck_ci -e TOSS_SECRET_KEY=test_gsk_ci \
            onair-backend:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health | grep -q '"db":"ok"'; then break; fi
            sleep 2
          done
          docker logs be
          curl -sf http://localhost:8080/health | grep -q '"db":"ok"'
          # 테스트 계정 로그인과 목록 조회가 응답하는지
          curl -sf -X POST http://localhost:8080/auth/guest | grep -q '"username":"guest_'
          curl -sf http://localhost:8080/broadcasts | grep -q '^\['
          curl -sf http://localhost:8080/recordings | grep -q '^\['
          # 시작 직후 멈추지 않았는지(재시작·종료 없이 계속 떠 있는지)
          test "$(docker inspect -f '{{.State.Running}}' be)" = true
