# PR과 main 반영 때마다 빌드·테스트를 돌린다 (#12).
# 비공개 저장소는 Actions 무료 사용 시간에 한도가 있어서, Rust 빌드 결과를 캐시해 시간을 줄인다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# 같은 PR에 새 커밋이 오면 이전 실행은 취소한다 (사용 시간 절약).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # DB 시험(#[sqlx::test])용 PostgreSQL. 시험마다 빈 DB를 새로 만들어 쓴다. 비밀번호는 CI 전용 예시 값이다.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: onair
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: onair
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onair"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://onair:ci-only@localhost:5432/onair
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: 포맷 검사
        run: cargo fmt --check
      - name: 린트 (clippy)
        run: cargo clippy --all-targets -- -D warnings
      - name: 테스트
        run: cargo test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 타입 검사 + 빌드
        run: npm run build
