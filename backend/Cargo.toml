[package]
name = "onair-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
dotenvy = "0.15.7"
getrandom = "0.4"
hex = "0.4.3"
hmac = "0.13.0"
# https 호출(토스 결제 API, #41): sqlx가 이미 쓰는 rustls + ring + webpki-roots로 맞춘다(C 빌드 도구·서버 인증서 파일 불필요)
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# 녹화 파일 내보내기(#47): Range(이어 보기·탐색) 지원
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "time"] }
time = { version = "0.3.55", features = ["serde-well-known"] }
tokio = { version = "1.54.1", features = ["full"] }
# 실시간 채팅(#86): tokio broadcast 채널을 SSE 스트림으로 바꾼다
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
