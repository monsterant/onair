# 배포 서버용 (#5). 저장소 맨 위에서 실행한다:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# 로컬 개발용 docker-compose.yml과 다른 점:
#   - 백엔드와 웹(Caddy)까지 컨테이너로 띄운다.
#   - 인터넷에 여는 포트는 80, 443(웹)과 WebRTC 영상 통로뿐이다. DB, 백엔드, OME 3333은 열지 않는다.
#   - 비밀값(DB 비밀번호, 서명 키)은 기본값 없이 deploy/.env에서만 받는다.
name: onair

# 메모리 상한(mem_limit, #135): 넘으면 먼저 상한만큼 스왑을 더 쓰며 느려지고(memswap_limit을 따로 정하지 않으면 Docker 기본값), 그래도 모자라면 그 컨테이너 안의 프로세스가 강제 종료된다. ome·backend·web은 컨테이너가 다시 시작되고, db는 끊긴 연결을 정리하고 스스로 복구한다.
# 상한이 없으면 한 컨테이너가 메모리를 다 써서 서버(1.8GB) 전체가 모자랄 때 아무 프로세스나 죽을 수 있다.
# 서버에서 하는 빌드에는 상한이 없다. 빌드가 메모리를 다 쓰면 서버 전체가 모자랄 수 있어, 빌드는 방송이 없을 때 한다.

# 컨테이너 로그 상한(#123). 서비스마다 10MB 파일 3개까지만 남기고 오래된 것부터 지운다.
# 상한이 없으면 오래 켜 둘수록 로그가 디스크를 채워 DB 쓰기·녹화·인증서 저장이 멈출 수 있다.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # 컨테이너 안의 프로그램이 실행 중에 더 높은 권한을 얻지 못하게 한다(#21 S4)
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    # 메모리 상한(#135). 11-14 실측 최대 38MB. 기본 공유 메모리 128MB와 같은 컨테이너에서 도는 백업(pg_dump)을 생각해 넉넉히
    mem_limit: 384m
    environment:
      POSTGRES_USER: onair
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env에 POSTGRES_PASSWORD를 넣으세요}
      POSTGRES_DB: onair
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onair"]
      interval: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    # 컨테이너 안의 프로그램이 실행 중에 더 높은 권한을 얻지 못하게 한다(#21 S4)
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    # 메모리 상한(#135). 11-14 실측 최대 4MB(송출·녹화 시험 중)
    mem_limit: 256m
    environment:
      DATABASE_URL: postgres://onair:${POSTGRES_PASSWORD}@db:5432/onair
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: info
      OME_ADMISSION_SECRET: ${OME_ADMISSION_SECRET:?deploy/.env에 OME_ADMISSION_SECRET을 넣으세요}
      # 심사용 테스트 계정 로그인(#4). 값이 없으면 꺼진다.
      DEMO_LOGIN: ${DEMO_LOGIN:-false}
      # 공용 데모 계정(/auth/demo/1,2)은 운영에서 닫는다(#130). 테스트 계정 버튼(/auth/guest)은 DEMO_LOGIN을 따른다.
      SHARED_DEMO_OFF: ${SHARED_DEMO_OFF:-true}
      # OME 관리 API(#3): 방송 종료 때 스트림 끊기, 15초마다 맞춰 보기. Docker 안쪽 주소라 인터넷에는 열리지 않는다.
      OME_API_URL: http://ome:8081
      OME_API_TOKEN: ${OME_API_TOKEN:?deploy/.env에 OME_API_TOKEN을 넣으세요}
      # 녹화 파일 폴더(#47). OME가 쓰고 백엔드가 읽고 내보내고 지운다
      RECORDINGS_DIR: /rec
      # 도네이션(#41): 토스 테스트 키. 비우면 도네이션이 꺼진다.
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
    volumes:
      - rec-data:/rec
    depends_on:
      db:
        condition: service_healthy
      rec-init:
        condition: service_completed_successfully

  ome:
    image: airensoft/ovenmediaengine:v0.21.0
    restart: unless-stopped
    # 컨테이너 안의 프로그램이 실행 중에 더 높은 권한을 얻지 못하게 한다(#21 S4)
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    # 메모리 상한(#135). 11-14 실측 최대 30MB(송출 1개·녹화 중). 영상은 다시 인코딩하지 않고(ome/Server.xml의 Bypass) 소리만 바꿔서
    # 방송 하나당 메모리가 크게 늘지 않는다. 방송·녹화가 여러 개 겹쳐도 되게 넉넉히
    mem_limit: 512m
    environment:
      # 브라우저가 영상 통로로 붙을 주소 = 서버의 공인 IP(고정 IP)
      OME_HOST_IP: ${OME_HOST_IP:?deploy/.env에 서버 공인 IP를 넣으세요}
      OME_ADMISSION_URL: http://backend:8080/ome/admission
      OME_ADMISSION_SECRET: ${OME_ADMISSION_SECRET}
      OME_API_TOKEN: ${OME_API_TOKEN}
    volumes:
      - ../ome/Server.xml:/opt/ovenmediaengine/bin/origin_conf/Server.xml:ro
      - ../ome/Logger.xml:/opt/ovenmediaengine/bin/origin_conf/Logger.xml:ro
      - rec-data:/rec
    ports:
      - "3478:3478"                    # WebRTC TCP 중계 (TURN)
      - "10000-10003:10000-10003/udp"  # WebRTC 영상·소리 통로
      - "10000:10000/tcp"              # WebRTC 직접 TCP 연결

  # 녹화 폴더 권한 맞추기(#47): OME(root)가 만든 파일을 백엔드(root 아닌 사용자)가 지울 수 있게 폴더를 쓰기 가능으로 둔다.
  # 한 번 실행하고 끝난다. 파일 내용은 그대로 OME 소유(읽기 전용)다.
  rec-init:
    image: busybox:1.36
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    command: ["sh", "-c", "chmod 0777 /rec"]
    volumes:
      - rec-data:/rec

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    # 컨테이너 안의 프로그램이 실행 중에 더 높은 권한을 얻지 못하게 한다(#21 S4)
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    # 메모리 상한(#135). 11-14 실측 최대 19MB
    mem_limit: 128m
    environment:
      DOMAIN: ${DOMAIN:?deploy/.env에 DOMAIN을 넣으세요}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # 받은 인증서를 보관한다. 지우면 다시 받는데, 너무 자주 받으면 Let's Encrypt가 한동안 막는다.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - ome

volumes:
  rec-data:
  db-data:
  caddy-data:
  caddy-config:
